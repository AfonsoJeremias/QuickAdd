name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Set version
        shell: pwsh
        run: |
          $v = "1.0.0"
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.TrimStart('v') }
          (Get-Content extension.yaml) -replace '^Version:.*', "Version: $v" | Set-Content extension.yaml
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Build
        run: dotnet build QuickAdd.csproj -c Release -o out

      - name: Package .pext
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path pkg | Out-Null
          Copy-Item out/QuickAdd.dll, extension.yaml -Destination pkg/
          Compress-Archive -Path pkg/* -DestinationPath "QuickAdd_$($env:VERSION).zip"
          Rename-Item "QuickAdd_$($env:VERSION).zip" "QuickAdd_$($env:VERSION).pext"

      - uses: actions/upload-artifact@v4
        with:
          name: QuickAdd-pext
          path: '*.pext'

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.pext'
